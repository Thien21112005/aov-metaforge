<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AOV MetaForge: Cấm chọn &amp; quay đội hình Liên Quân</title>
  
  <!-- Google Fonts: Saira Condensed (names, numerals) & Be Vietnam Pro (reading); both cover Vietnamese -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Saira+Condensed:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/aov_metaforge_logo.png">
  
  <!-- Stylesheet (Anti-Cache) -->
  <link rel="stylesheet" href="css/style.css?v=3.0">
  <link rel="stylesheet" href="css/gacha.css?v=3.0">
  <link rel="stylesheet" href="css/draft.css?v=3.0">
  <link rel="stylesheet" href="css/catalog.css?v=3.0">
  
  <!-- GSAP Animation Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>

  <div class="app-wrapper">
    <header class="app-header">
      <div class="brand-area">
        <div class="brand-logo-frame">
          <img src="assets/images/aov_metaforge_logo.png" alt="" class="brand-logo" />
        </div>
        <h1 class="brand-title">AOV METAFORGE</h1>
      </div>

      <nav class="nav-tabs" data-i18n-label="nav.label">
        <button class="nav-tab active" data-target="tab-gacha" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>
          <span data-i18n="nav.gacha">Quay đội hình</span>
        </button>
        <button class="nav-tab" data-target="tab-banpick">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3l14 14M19 3L5 17M3 15l6 6M21 15l-6 6"/></svg>
          <span data-i18n="nav.draft">Cấm chọn</span>
        </button>
        <button class="nav-tab" data-target="tab-catalog">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg>
          <span data-i18n="nav.catalog">Tướng</span>
        </button>
      </nav>

      <div class="header-actions">
        <div class="lang-switch" role="group" data-i18n-label="ctl.lang">
          <button class="lang-btn" data-lang="vi" lang="vi" aria-label="Tiếng Việt">VI</button>
          <button class="lang-btn" data-lang="en" lang="en" aria-label="English">EN</button>
        </div>
        <div class="bgm-player-widget" id="bgm-player-widget">
          <button class="ctl-btn" id="btn-bgm-toggle" aria-pressed="false">
            <span class="bgm-eq" id="bgm-eq-visualizer" aria-hidden="true">
              <span class="eq-bar"></span>
              <span class="eq-bar"></span>
              <span class="eq-bar"></span>
            </span>
            <span class="ctl-label" id="bgm-status-label" data-i18n="ctl.music">Nhạc nền</span>
          </button>
          <input type="range" id="bgm-volume-slider" class="bgm-slider" min="0" max="100" value="35" data-i18n-label="ctl.volume" />
        </div>
        <button class="ctl-btn is-on" id="btn-toggle-sound" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10v4h4l5 4V6L8 10z"/><path class="sound-wave" d="M16.5 9a4 4 0 0 1 0 6"/></svg>
          <span class="ctl-label" data-i18n="ctl.sound">Âm thanh</span>
        </button>
      </div>
    </header>

    <!-- MAIN CONTENT TABS -->
    <main class="app-main">
      
      <!-- ===================================================
           TAB 1: TEAM ROLL
           =================================================== -->
      <section id="tab-gacha" class="tab-panel active">
        <div class="gacha-stage">
          <div class="gacha-controls">
            <h2 class="gacha-title" data-i18n="gacha.title">Quay đội hình</h2>
            <div class="seg" role="group" data-i18n-label="gacha.modes">
              <button class="seg-btn mode-btn active" data-mode="5" aria-pressed="true" data-i18n="gacha.mode.5">5 đường</button>
              <button class="seg-btn mode-btn" data-mode="3" aria-pressed="false" data-i18n="gacha.mode.3">Bộ ba</button>
              <button class="seg-btn mode-btn" data-mode="2" aria-pressed="false" data-i18n="gacha.mode.2">Cặp</button>
              <button class="seg-btn mode-btn" data-mode="1" aria-pressed="false" data-i18n="gacha.mode.1">1 tướng</button>
              <button class="seg-btn mode-btn" data-mode="custom" aria-pressed="false" data-i18n="gacha.mode.custom">Tự chọn đường</button>
            </div>
            <select class="lane-select" id="gacha-lane-select-1" data-i18n-label="gacha.pickLane" hidden>
              <option value="all" data-i18n="gacha.anyLane"></option>
              <option value="top" data-i18n="lane.top"></option>
              <option value="jungle" data-i18n="lane.jungle"></option>
              <option value="mid" data-i18n="lane.mid"></option>
              <option value="ad" data-i18n="lane.ad"></option>
              <option value="sp" data-i18n="lane.sp"></option>
            </select>
            <div class="custom-lanes" id="gacha-custom-lanes" hidden>
              <label class="custom-lane-chip">
                <input type="checkbox" class="lane-chk" value="top" checked />
                <span class="chip-ui" data-i18n="short.top">Top</span>
              </label>
              <label class="custom-lane-chip">
                <input type="checkbox" class="lane-chk" value="jungle" checked />
                <span class="chip-ui" data-i18n="short.jungle">Rừng</span>
              </label>
              <label class="custom-lane-chip">
                <input type="checkbox" class="lane-chk" value="mid" checked />
                <span class="chip-ui" data-i18n="short.mid">Mid</span>
              </label>
              <label class="custom-lane-chip">
                <input type="checkbox" class="lane-chk" value="ad" checked />
                <span class="chip-ui" data-i18n="short.ad">AD</span>
              </label>
              <label class="custom-lane-chip">
                <input type="checkbox" class="lane-chk" value="sp" checked />
                <span class="chip-ui" data-i18n="short.sp">SP</span>
              </label>
            </div>
            <button class="btn-big-roll" id="btn-roll-gacha" data-i18n="gacha.roll">Quay đội hình</button>
          </div>

          <div id="gacha-reels-container" class="reels-grid lanes-count-5"></div>

          <div class="result-line" id="gacha-result-banner" aria-live="polite"></div>
        </div>

        <section class="gacha-archive">
          <div class="archive-header">
            <h2 data-i18n="archive.title">Lịch sử quay</h2>
            <button class="ctl-btn" id="btn-clear-archive" data-i18n="archive.clear">Xóa lịch sử</button>
          </div>
          <ul class="archive-list" id="gacha-archive-list"></ul>
        </section>
      </section>

      <!-- ===================================================
           TAB 2: DRAFT BOARD
           =================================================== -->
      <section id="tab-banpick" class="tab-panel">
        <div class="draft-toolbar">
          <span class="toolbar-label" id="first-pick-label" data-i18n="draft.firstPick">Chọn trước</span>
          <div class="seg" role="group" aria-labelledby="first-pick-label">
            <button class="seg-btn active" id="btn-blue-first" data-i18n="team.blue">Đội Xanh</button>
            <button class="seg-btn" id="btn-red-first" data-i18n="team.red">Đội Đỏ</button>
          </div>
          <button class="ctl-btn" id="btn-prev-step" data-i18n="draft.prev">Lượt trước</button>
          <button class="ctl-btn" id="btn-next-step" data-i18n="draft.next">Lượt tiếp</button>
          <div class="toolbar-end">
            <button class="ctl-btn" id="btn-draft-timer" data-i18n="draft.timer">Đồng hồ</button>
            <button class="ctl-btn" id="btn-quick-meta-fill" data-i18n="draft.sample">Tình huống mẫu</button>
            <button class="ctl-btn" id="btn-reset-banpick" data-i18n="draft.reset">Đặt lại</button>
          </div>
        </div>

        <div class="draft-ban-bar" id="draft-ban-bar">
          <div class="bans-row" id="blue-bans"></div>
          <div class="turn-clock">
            <span class="clock-time" id="draft-clock">0:30</span>
            <span class="turn-line" id="draft-turn-line" aria-live="polite"></span>
          </div>
          <div class="bans-row" id="red-bans"></div>
        </div>

        <div class="draft-board" id="draft-board">
          <div class="team-rail team-blue">
            <div class="rail-head">
              <h2 data-i18n="team.blue">Đội Xanh</h2>
              <span class="rail-order" id="blue-order"></span>
            </div>
            <div class="picks-column" id="blue-picks"></div>
          </div>

          <div class="draft-center">
            <div class="draft-seam" id="draft-seam" role="group" data-i18n-label="draft.seamLabel"></div>
            <div class="hero-picker" id="hero-picker">
              <div class="picker-head">
                <h3 class="picker-title" id="picker-title" aria-live="polite"></h3>
                <div class="picker-head-actions">
                  <button class="ctl-btn" id="picker-clear" hidden></button>
                  <button class="ctl-btn" id="picker-close" data-i18n="ctl.close">Đóng</button>
                </div>
              </div>
              <div class="picker-tools">
                <input type="text" id="picker-search" class="text-input" data-i18n-placeholder="picker.search" data-i18n-label="picker.search" />
                <div class="seg lane-filters" role="group" data-i18n-label="filter.label">
                  <button class="seg-btn picker-filter active" data-lane="all" data-i18n="filter.all">Tất cả</button>
                  <button class="seg-btn picker-filter" data-lane="top" data-i18n="short.top">Top</button>
                  <button class="seg-btn picker-filter" data-lane="jungle" data-i18n="short.jungle">Rừng</button>
                  <button class="seg-btn picker-filter" data-lane="mid" data-i18n="short.mid">Mid</button>
                  <button class="seg-btn picker-filter" data-lane="ad" data-i18n="short.ad">AD</button>
                  <button class="seg-btn picker-filter" data-lane="sp" data-i18n="short.sp">SP</button>
                </div>
              </div>
              <div class="picker-grid" id="picker-grid"></div>
            </div>
            <div class="verdict-strip" id="verdict-strip">
              <ul class="verdict-list" id="verdict-list"></ul>
              <button class="ctl-btn verdict-more" id="verdict-more" data-i18n="analysis.more">Xem phân tích</button>
            </div>
          </div>

          <div class="team-rail team-red">
            <div class="rail-head">
              <h2 data-i18n="team.red">Đội Đỏ</h2>
              <span class="rail-order" id="red-order"></span>
            </div>
            <div class="picks-column" id="red-picks"></div>
          </div>
        </div>
        <div class="picker-scrim" id="picker-scrim"></div>

        <section class="draft-analysis" id="draft-analysis">
          <h2 class="analysis-title" data-i18n="analysis.title">Phân tích kèo</h2>
          <div id="bp-analysis-content"></div>
          <div class="team-metrics-comparison">
            <div id="blue-team-metrics"></div>
            <div id="red-team-metrics"></div>
          </div>
        </section>
      </section>

      <!-- ===================================================
           TAB 3: HERO COMPENDIUM
           =================================================== -->
      <section id="tab-catalog" class="tab-panel">
        <div class="catalog-bar">
          <input type="text" id="catalog-search" class="text-input" data-i18n-placeholder="catalog.search" data-i18n-label="catalog.search" />
          <div class="seg lane-filters" role="group" data-i18n-label="filter.label">
            <button class="seg-btn catalog-filter-btn active" data-lane="all" aria-pressed="true" data-i18n="filter.all">Tất cả</button>
            <button class="seg-btn catalog-filter-btn" data-lane="top" aria-pressed="false" data-i18n="short.top">Top</button>
            <button class="seg-btn catalog-filter-btn" data-lane="jungle" aria-pressed="false" data-i18n="short.jungle">Rừng</button>
            <button class="seg-btn catalog-filter-btn" data-lane="mid" aria-pressed="false" data-i18n="short.mid">Mid</button>
            <button class="seg-btn catalog-filter-btn" data-lane="ad" aria-pressed="false" data-i18n="short.ad">AD</button>
            <button class="seg-btn catalog-filter-btn" data-lane="sp" aria-pressed="false" data-i18n="short.sp">SP</button>
          </div>
          <span class="catalog-count" id="catalog-count" aria-live="polite"></span>
        </div>
        <div class="catalog-grid" id="catalog-grid"></div>
      </section>

    </main>
  </div>

  <!-- HERO DETAIL -->
  <dialog class="hero-dialog" id="hero-detail-modal" aria-labelledby="detail-hero-name">
    <button class="ctl-btn dialog-close" id="detail-modal-close" data-i18n-label="ctl.close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div id="hero-detail-content"></div>
  </dialog>

  <!-- NATIVE BGM AUDIO ELEMENT -->
  <audio id="aov-bgm-audio" loop preload="auto">
    <source src="assets/audio/aov_theme.webm" type="audio/webm">
    <source src="assets/audio/aov_theme.m4a" type="audio/mp4">
  </audio>

  <!-- SCRIPTS -->
  <script src="js/core/data.js?v=3.0"></script>
  <script src="js/core/i18n.js?v=3.0"></script>
  <script src="js/core/ui.js?v=3.0"></script>
  <script src="js/core/audio.js?v=3.0"></script>
  <script src="js/modules/analyzer.js?v=3.0"></script>
  <script src="js/modules/draft.js?v=3.0"></script>
  <script src="js/modules/gacha.js?v=3.0"></script>
  <script src="js/app.js?v=3.0"></script>
</body>
</html>
